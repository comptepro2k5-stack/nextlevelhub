<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Connexion membre Next Level Hub avec Google ou adresse email."
    />
    <title>Connexion - Next Level Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      :root {
        --white: #ffffff;
        --black: #020202;
        --glass: rgba(255, 255, 255, 0.14);
        --stroke: rgba(255, 255, 255, 0.42);
        --stroke-soft: rgba(255, 255, 255, 0.18);
        --blue: #0094ff;
        --muted: rgba(255, 255, 255, 0.68);
        --shadow: rgba(0, 0, 0, 0.54);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--white);
        background: #101010;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
      }

      .auth-shell {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        padding: 24px;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% -8%, rgba(255, 255, 255, 0.95) 0 13%, rgba(210, 210, 210, 0.7) 19%, transparent 30%),
          radial-gradient(ellipse at 15% 80%, rgba(255, 255, 255, 0.34), transparent 35%),
          linear-gradient(135deg, #2b2b2b 0%, #060606 48%, #000000 74%, #d7d7d7 100%);
      }

      .auth-shell::before,
      .auth-shell::after {
        position: absolute;
        inset: -20%;
        z-index: -2;
        pointer-events: none;
        content: "";
      }

      .auth-shell::before {
        background:
          radial-gradient(ellipse at 50% 12%, rgba(255, 255, 255, 0.8) 0 15%, rgba(255, 255, 255, 0.13) 31%, transparent 44%),
          linear-gradient(24deg, transparent 0 34%, rgba(255, 255, 255, 0.34) 35%, rgba(255, 255, 255, 0.07) 48%, transparent 49%),
          linear-gradient(154deg, transparent 0 40%, rgba(255, 255, 255, 0.2) 41%, transparent 60%);
      }

      .auth-shell::after {
        z-index: -1;
        background:
          radial-gradient(ellipse at 16% 52%, rgba(0, 0, 0, 0.96) 0 20%, transparent 42%),
          radial-gradient(ellipse at 62% 49%, rgba(0, 0, 0, 0.96) 0 24%, transparent 45%),
          radial-gradient(ellipse at 84% 74%, rgba(0, 0, 0, 0.9) 0 18%, transparent 35%);
        filter: blur(14px);
      }

      .auth-ribbon {
        position: absolute;
        left: -15%;
        right: -15%;
        z-index: -1;
        height: 28vh;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.94), rgba(255, 255, 255, 0.18));
        filter: blur(18px);
        pointer-events: none;
      }

      .auth-ribbon--one {
        top: 27%;
        transform: rotate(7deg);
      }

      .auth-ribbon--two {
        top: 56%;
        transform: rotate(-8deg);
      }

      .auth-card {
        width: min(100%, 430px);
        border: 1px solid var(--stroke);
        border-radius: 34px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(0, 0, 0, 0.38));
        box-shadow: inset 0 1px 22px rgba(255, 255, 255, 0.16), 0 34px 90px var(--shadow);
        backdrop-filter: blur(22px) saturate(140%);
        -webkit-backdrop-filter: blur(22px) saturate(140%);
        padding: 26px;
      }

      .auth-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 34px;
      }

      .auth-brand__mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 16px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.16));
        color: #171717;
        font-size: 25px;
        font-weight: 900;
      }

      .auth-brand__name {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.08em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.38);
      }

      .auth-header {
        margin-bottom: 26px;
      }

      .auth-header__eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .auth-header__title {
        margin: 0 0 10px;
        font-size: clamp(30px, 7vw, 44px);
        font-weight: 900;
        letter-spacing: -0.07em;
        line-height: 0.96;
      }

      .auth-header__text {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .auth-options {
        display: grid;
        gap: 14px;
      }

      .google-button,
      .email-form__submit {
        display: flex;
        width: 100%;
        min-height: 54px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border: 1px solid var(--stroke);
        border-radius: 18px;
        cursor: pointer;
        color: var(--white);
        font-weight: 850;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.06));
        box-shadow: inset 0 1px 16px rgba(255, 255, 255, 0.12), 0 14px 34px rgba(0, 0, 0, 0.26);
      }

      .google-button__icon {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 50%;
        background: #ffffff;
        color: #111827;
        font-weight: 900;
      }

      .auth-divider {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 12px;
        align-items: center;
        margin: 6px 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .auth-divider::before,
      .auth-divider::after {
        height: 1px;
        background: var(--stroke-soft);
        content: "";
      }

      .email-form {
        display: grid;
        gap: 12px;
      }

      .email-form__label {
        color: rgba(255, 255, 255, 0.78);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .email-form__input {
        width: 100%;
        min-height: 54px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 18px;
        outline: none;
        padding: 0 17px;
        color: var(--white);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 16px rgba(255, 255, 255, 0.08);
      }

      .email-form__input::placeholder {
        color: rgba(255, 255, 255, 0.48);
      }

      .email-form__input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(0, 148, 255, 0.2), inset 0 1px 16px rgba(255, 255, 255, 0.08);
      }

      .email-form__submit {
        border-color: rgba(0, 148, 255, 0.82);
        background: linear-gradient(145deg, rgba(0, 148, 255, 0.82), rgba(0, 0, 0, 0.42));
      }

      .auth-footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 24px;
        color: var(--muted);
        font-size: 13px;
      }

      .auth-footer__link {
        color: rgba(255, 255, 255, 0.92);
        font-weight: 800;
      }

      .auth-status {
        display: none;
        margin: 18px 0 0;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 16px;
        padding: 13px 14px;
        color: rgba(255, 255, 255, 0.82);
        background: rgba(255, 255, 255, 0.08);
        font-size: 13px;
        line-height: 1.45;
      }

      .auth-status--visible {
        display: block;
      }

      .auth-status--error {
        border-color: rgba(255, 105, 105, 0.55);
        background: rgba(255, 64, 64, 0.12);
      }

      .auth-status--success {
        border-color: rgba(0, 148, 255, 0.72);
        background: rgba(0, 148, 255, 0.14);
      }

      .google-button:disabled,
      .email-form__submit:disabled {
        cursor: not-allowed;
        opacity: 0.62;
      }

      @media (max-width: 520px) {
        .auth-shell {
          padding: 16px;
          place-items: stretch;
        }

        .auth-card {
          align-self: center;
          padding: 22px;
          border-radius: 28px;
        }

        .auth-footer {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <main class="auth-shell" aria-labelledby="login-title">
      <span class="auth-ribbon auth-ribbon--one" aria-hidden="true"></span>
      <span class="auth-ribbon auth-ribbon--two" aria-hidden="true"></span>

      <section class="auth-card" aria-label="Formulaire de connexion">
        <a class="auth-brand" href="index.html" aria-label="Retour accueil Next Level Hub">
          <span class="auth-brand__mark" aria-hidden="true">N</span>
          <span class="auth-brand__name">Next Level Hub</span>
        </a>

        <header class="auth-header">
          <p class="auth-header__eyebrow">Accès membre</p>
          <h1 class="auth-header__title" id="login-title">Connexion</h1>
          <p class="auth-header__text">
            Accède à tes formations, communautés privées, ressources premium et dashboards créateur.
          </p>
        </header>

        <div class="auth-options">
          <button class="google-button" id="google-login" type="button" aria-label="Continuer avec Google">
            <span class="google-button__icon" aria-hidden="true">G</span>
            <span>Continuer avec Google</span>
          </button>

          <div class="auth-divider" role="separator" aria-label="ou">
            <span>ou</span>
          </div>

          <form class="email-form" id="email-login">
            <label class="email-form__label" for="email">Adresse email</label>
            <input
              class="email-form__input"
              id="email"
              name="email"
              type="email"
              placeholder="toi@exemple.com"
              autocomplete="email"
              required
            />
            <button class="email-form__submit" type="submit">Recevoir mon lien magique</button>
          </form>
        </div>

        <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p>

        <footer class="auth-footer">
          <span>Pas encore membre ?</span>
          <a class="auth-footer__link" href="index.html">Découvrir Next Level Hub</a>
        </footer>
      </section>
    </main>

    <script type="module">
      import {
        AUTH_REDIRECT_URL,
        DASHBOARD_URL,
        createSupabaseClient,
        isSupabaseConfigured
      } from "./supabase-config.js?v=3";

      const statusEl = document.querySelector("#auth-status");
      const googleButton = document.querySelector("#google-login");
      const emailForm = document.querySelector("#email-login");
      const emailInput = document.querySelector("#email");
      const submitButton = emailForm.querySelector("button[type='submit']");

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className = `auth-status auth-status--visible auth-status--${type}`;
      }

      function setLoading(isLoading) {
        googleButton.disabled = isLoading;
        submitButton.disabled = isLoading;
      }

      if (!isSupabaseConfigured()) {
        setStatus(
          "Configuration Supabase manquante : renseigne SUPABASE_URL et SUPABASE_ANON_KEY dans supabase-config.js.",
          "error"
        );
        setLoading(true);
      } else {
        const supabase = createSupabaseClient();

        const { data } = await supabase.auth.getSession();
        if (data.session) {
          window.location.href = DASHBOARD_URL;
        }

        googleButton.addEventListener("click", async () => {
          setLoading(true);
          setStatus("Redirection vers Google...", "info");

          const { error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: AUTH_REDIRECT_URL,
              queryParams: {
                access_type: "offline",
                prompt: "consent"
              }
            }
          });

          if (error) {
            setLoading(false);
            setStatus(error.message, "error");
          }
        });

        emailForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const email = emailInput.value.trim();

          if (!email) {
            setStatus("Entre ton adresse email pour recevoir le lien magique.", "error");
            return;
          }

          setLoading(true);
          setStatus("Envoi du lien magique...", "info");

          const { error } = await supabase.auth.signInWithOtp({
            email,
            options: {
              emailRedirectTo: AUTH_REDIRECT_URL
            }
          });

          setLoading(false);

          if (error) {
            setStatus(error.message, "error");
            return;
          }

          setStatus("Lien envoye. Verifie ta boite email pour te connecter.", "success");
          emailForm.reset();
        });
      }
    </script>
  </body>
</html>
