<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Connexion en cours - Next Level Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        color: #ffffff;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.9), transparent 28%),
          linear-gradient(135deg, #2b2b2b, #000000 65%, #d7d7d7);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .callback-card {
        width: min(100% - 32px, 420px);
        border: 1px solid rgba(255, 255, 255, 0.36);
        border-radius: 28px;
        padding: 28px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(0, 0, 0, 0.42));
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.54);
        backdrop-filter: blur(20px);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 32px;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="callback-card">
      <h1>Connexion...</h1>
      <p id="callback-message">Validation de ta session securisee.</p>
    </main>

    <script type="module">
      import {
        DASHBOARD_URL,
        LOGIN_URL,
        createSupabaseClient,
        isSupabaseConfigured
      } from "./supabase-config.js?v=3";

      const message = document.querySelector("#callback-message");

      if (!isSupabaseConfigured()) {
        message.textContent = "Configuration Supabase manquante. Retour a la connexion.";
        window.setTimeout(() => {
          window.location.href = LOGIN_URL;
        }, 1800);
      } else {
        const supabase = createSupabaseClient();
        const params = new URLSearchParams(window.location.search);

        if (params.has("code")) {
          const { error } = await supabase.auth.exchangeCodeForSession(window.location.href);
          if (error) {
            message.textContent = error.message;
            window.setTimeout(() => {
              window.location.href = LOGIN_URL;
            }, 2200);
          } else {
            window.location.href = DASHBOARD_URL;
          }
        } else {
          const { data } = await supabase.auth.getSession();
          window.location.href = data.session ? DASHBOARD_URL : LOGIN_URL;
        }
      }
    </script>
  </body>
</html>
